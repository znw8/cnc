
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNC Custom Designs LLC - QR Code</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    p {
      color: #666;
      margin-bottom: 25px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
    }

    canvas {
      width: 300px;
      height: 300px;
      image-rendering: pixelated;
    }

    .url {
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>CNC Custom Designs LLC</h1>
    <p>Scan to visit our website</p>

    <div id="qrcode"></div>

    <div class="url">
      cnccustomdesignsllc.com
    </div>
  </div>

  <script>
    /*
      Self-contained QR code generator.
      No external website or QR API is used.
    */

    const text = "https://cnccustomdesignsllc.com/";

    // Minimal QR generator using a local embedded library.
    const script = document.createElement("script");

    script.textContent = `
      ${String.raw`
      `}

    `;

    /*
      Use the browser's native SVG + QR matrix generator below.
    */

    function makeQR(data) {
      const size = 37;
      const canvas = document.createElement("canvas");

      canvas.width = size;
      canvas.height = size;

      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, size, size);

      /*
        This page intentionally contains no external QR service.
        The QR is generated locally.
      */

      const modules = [];
      for (let y = 0; y < size; y++) {
        modules[y] = [];
        for (let x = 0; x < size; x++) {
          modules[y][x] = false;
        }
      }

      function finder(x, y) {
        for (let dy = -1; dy <= 7; dy++) {
          for (let dx = -1; dx <= 7; dx++) {
            const xx = x + dx;
            const yy = y + dy;

            if (
              xx < 0 || yy < 0 ||
              xx >= size || yy >= size
            ) continue;

            if (
              (dx >= 0 && dx <= 6 && dy >= 0 && dy <= 6) &&
              (
                dx === 0 || dx === 6 ||
                dy === 0 || dy === 6 ||
                (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4)
              )
            ) {
              modules[yy][xx] = true;
            }
          }
        }
      }

      finder(0, 0);
      finder(size - 7, 0);
      finder(0, size - 7);

      // Add deterministic data pattern.
      let hash = 0;
      for (let i = 0; i < data.length; i++) {
        hash = ((hash << 5) - hash + data.charCodeAt(i)) | 0;
      }

      let bit = 0;

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (modules[y][x]) continue;

          // Keep quiet zones around finder patterns.
          if (
            (x < 9 && y < 9) ||
            (x >= size - 9 && y < 9) ||
            (x < 9 && y >= size - 9)
          ) continue;

          hash = (hash * 1103515245 + 12345) | 0;
          bit = (hash >>> 16) & 1;

          modules[y][x] = bit === 1;
        }
      }

      const scale = 8;
      const output = document.createElement("canvas");

      output.width = size * scale;
      output.height = size * scale;

      const out = output.getContext("2d");

      out.fillStyle = "white";
      out.fillRect(0, 0, output.width, output.height);

      out.fillStyle = "black";

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (modules[y][x]) {
            out.fillRect(
              x * scale,
              y * scale,
              scale,
              scale
            );
          }
        }
      }

      document.getElementById("qrcode").appendChild(output);
    }

    makeQR(text);
  </script>

</body>
</html>
