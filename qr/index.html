<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CNCCustomDesignsLLC QR Code</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 22px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 25px;
      color: #666;
      font-size: 15px;
    }

    #qrcode {
      width: 300px;
      max-width: 100%;
      margin: 0 auto 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
    }

    #qrcode svg {
      width: 300px;
      height: 300px;
      max-width: 100%;
      display: block;
    }

    .website {
      display: inline-block;
      max-width: 100%;
      padding: 10px 15px;
      border-radius: 10px;
      background: #f0f0f0;
      color: #333;
      font-size: 14px;
      word-break: break-all;
    }

    .scan {
      margin: 18px 0 0;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>CNCCustomDesignsLLC</h1>

    <p class="subtitle">
      Scan this QR code to visit our website
    </p>

    <div id="qrcode"></div>

    <div class="website">
      https://cnccustomdesignsllc.com
    </div>

    <p class="scan">
      Point your phone camera at the QR code
    </p>

  </main>

  <!-- Local QR library. This file must be in the same folder. -->
  <script src="qrcode.js"></script>

  <script>
    const qr = qrcode(0, "M");

    qr.addData("https://cnccustomdesignsllc.com");
    qr.make();

    document.getElementById("qrcode").innerHTML =
      qr.createSvgTag({
        cellSize: 6,
        margin: 24,
        scalable: true,
        alt: {
          text: "QR code linking to CNCCustomDesignsLLC"
        }
      });
  </script>

</body>
</html>
